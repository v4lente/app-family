version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=appfamily
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://localhost:8080
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appfamily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    image: postgres:15
    command: >
      bash -c "for f in /migrations/*.sql; do echo 'Running migration: $$f'; psql -h db -U postgres -d appfamily -f \"$$f\"; done"
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./backend/scripts/migrations:/migrations
    depends_on:
      - db
volumes:
  pgdata:
